<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Document Q&A</title>
<style>
  * { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 720px;
    margin: 60px auto;
    padding: 0 20px;
    background: #0f1115;
    color: #e6e6e6;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 8px;
  }

  .subtitle {
    color: #9a9a9a;
    margin-bottom: 32px;
    font-size: 0.95rem;
  }

  section {
    margin-bottom: 24px;
    padding: 24px;
    background: #1a1d24;
    border: 1px solid #2a2e38;
    border-radius: 12px;
  }

  section h2 {
    font-size: 1rem;
    margin: 0 0 16px 0;
    color: #cfcfcf;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #4f7cff;
    color: white;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .row {
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #333744;
    background: #12141a;
    color: #e6e6e6;
    font-size: 0.95rem;
  }

  input[type="text"]:focus {
    outline: none;
    border-color: #4f7cff;
  }

  input[type="file"] {
    color: #b8b8b8;
    font-size: 0.9rem;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    background: #4f7cff;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.15s ease;
  }

  button:hover { background: #3d68f0; }
  button:active { transform: scale(0.98); }

  #uploadStatus, #answer {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #12141a;
    border: 1px solid #262a34;
    white-space: pre-wrap;
    font-size: 0.9rem;
    line-height: 1.5;
    display: none;
  }

  #uploadStatus:not(:empty), #answer:not(:empty) {
    display: block;
  }

  .loading {
    color: #9a9a9a;
    font-style: italic;
  }

  .success { border-color: #2e7d4f !important; }
  .error { border-color: #a33 !important; color: #ff8080; }
</style>
</head>
<body>
  <h1>📄 RAG Document Q&A</h1>
  <div class="subtitle">Upload a PDF, then ask questions grounded in its content.</div>

  <section>
    <h2><span class="badge">1</span> Upload a PDF</h2>
    <div class="row">
      <input type="file" id="pdfFile" accept="application/pdf">
      <button onclick="uploadFile()">Upload</button>
    </div>
    <div id="uploadStatus"></div>
  </section>

  <section>
    <h2><span class="badge">2</span> Ask a question</h2>
    <div class="row">
      <input type="text" id="question" placeholder="Ask something about the uploaded PDF...">
      <button onclick="askQuestion()">Ask</button>
    </div>
    <div id="answer"></div>
  </section>

  <script>
    async function uploadFile() {
      const fileInput = document.getElementById("pdfFile");
      const statusDiv = document.getElementById("uploadStatus");

      if (!fileInput.files.length) {
        statusDiv.className = "error";
        statusDiv.textContent = "Please select a PDF file first.";
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      statusDiv.className = "loading";
      statusDiv.textContent = "Uploading...";

      try {
        const res = await fetch("/upload", { method: "POST", body: formData });
        const data = await res.json();
        statusDiv.className = "success";
        statusDiv.textContent = `Uploaded "${data.filename}" — ${data.chunks} chunks created.`;
      } catch (err) {
        statusDiv.className = "error";
        statusDiv.textContent = "Upload failed: " + err.message;
      }
    }

    async function askQuestion() {
      const question = document.getElementById("question").value.trim();
      const answerDiv = document.getElementById("answer");

      if (!question) {
        answerDiv.className = "error";
        answerDiv.textContent = "Please type a question.";
        return;
      }

      answerDiv.className = "loading";
      answerDiv.textContent = "Thinking...";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await res.json();
        answerDiv.className = "";
        answerDiv.textContent = data.answer;
      } catch (err) {
        answerDiv.className = "error";
        answerDiv.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
